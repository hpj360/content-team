name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" "sqlalchemy[asyncio]" aiosqlite \
            pydantic pydantic-settings python-dotenv \
            pytest pytest-asyncio httpx ruff

      - name: Lint (project rules)
        run: ruff check --isolated --select E4,E7,E9,F --line-length 100 src/hermes/content_team tests/content_team tests/test_creative_skills.py

      - name: Skill lint + content-team tests
        run: pytest tests/test_creative_skills.py tests/content_team -q

      - name: Full suite (allowing known pre-existing failures)
        continue-on-error: true
        run: pytest -q

      # 实网联调：默认跳过；设置仓库变量 ENABLE_LIVE_LLM=true 且在 Secrets 配置
      # ZAI_API_KEY 后自动启用
      - name: Live LLM suite (optional)
        if: ${{ vars.ENABLE_LIVE_LLM == 'true' }}
        env:
          CONTENT_TEAM_LIVE_LLM: "1"
          HERMES_LLM_PROVIDER: ${{ vars.HERMES_LLM_PROVIDER }}
          HERMES_LLM_MODEL: ${{ vars.HERMES_LLM_MODEL }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: pytest tests/content_team/test_creative_llm_live.py -q
